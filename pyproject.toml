[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ideatlas-automation"
version = "0.1.0"
description = "Automation layer around the IDEAtlas ai-dua-mapping framework (SDG 11.1.1)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
dependencies = [
    "PyYAML>=6.0",
    "openpyxl>=3.0",
    "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q"
markers = [
    "slow: fine-tuning chain test (needs reference fixtures and several minutes)",
]